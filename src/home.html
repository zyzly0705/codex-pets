<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yoyo 小屋</title>
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <main class="home-shell" aria-label="Yoyo 小屋">
    <section class="room-stage" aria-label="Yoyo 的房间">
      <img id="room-art" class="room-art" src="../assets/yoyo/home/room-shell-clean-2d.webp" alt="">

      <div class="home-decor-layer" id="home-decor-layer" aria-hidden="true"></div>
      <div class="home-scene-objects scene-objects-back" id="home-scene-objects-back" aria-hidden="true"></div>
      <div class="room-effects" id="room-effects" aria-hidden="true"></div>

      <button class="room-hotspot hotspot-food" type="button" data-action="feed" aria-label="食盆：喂饭" data-tip="食盆 · 喂Yoyo吃饭">
        <img src="../assets/yoyo/home/prop-food.webp" alt="">
      </button>
      <button class="room-hotspot hotspot-bath" type="button" data-action="bath" aria-label="浴盆：洗澡" data-tip="浴盆 · 洗香香">
        <img src="../assets/yoyo/home/prop-bath.webp" alt="">
      </button>
      <button class="room-hotspot hotspot-bed" type="button" data-action="sleep" aria-label="小床：休息" data-tip="小床 · 休息一下">
        <img src="../assets/yoyo/home/prop-bed.webp" alt="">
      </button>
      <button class="room-hotspot hotspot-toy" type="button" data-action="play" aria-label="玩具箱：陪玩" data-tip="玩具箱 · 陪Yoyo玩">
        <img src="../assets/yoyo/home/prop-toy.webp" alt="">
      </button>
      <button class="room-hotspot hotspot-heart" type="button" data-action="pet" aria-label="Yoyo：摸摸" data-tip="Yoyo · 摸摸她">
        <img src="../assets/yoyo/home/prop-heart.webp" alt="">
      </button>

      <div class="pet-zone">
        <canvas id="home-pet" width="192" height="208" aria-label="Yoyo"></canvas>
        <img id="home-sleep-pose" class="home-sleep-pose" src="../assets/yoyo/home/home-sleep-yoyo.webp" alt="" aria-hidden="true">
        <div class="accessory-layer" id="accessory-layer" aria-hidden="true"></div>
      </div>
      <div class="home-scene-objects scene-objects-front" id="home-scene-objects-front" aria-hidden="true"></div>
      <img id="home-action-composite" class="home-action-composite" src="../assets/yoyo/home/composite-sleep-bed-yoyo.webp" alt="" aria-hidden="true">

      <div class="status-orbs" id="needs-list" aria-label="Yoyo 状态"></div>

      <div class="room-controls" id="room-controls">
        <button class="ctrl-btn" id="ctrl-toggle" aria-label="小屋设置" data-tip="小屋设置">✦</button>
        <div class="ctrl-panel" id="ctrl-panel" aria-hidden="true">
          <div class="ctrl-row">
            <button class="scene-chip scene-default active" type="button" data-room-scene="default" aria-label="日常小屋" data-tip="日常小屋"></button>
            <button class="scene-chip scene-rainy" type="button" data-room-scene="rainy" aria-label="雨天小屋" data-tip="雨天小屋"></button>
            <button class="scene-chip scene-night" type="button" data-room-scene="night" aria-label="夜晚小屋" data-tip="夜晚小屋"></button>
            <button class="scene-chip scene-party" type="button" data-room-scene="party" aria-label="派对小屋" data-tip="派对小屋"></button>
          </div>
          <div class="ctrl-row">
            <button class="decor-chip decor-fairy active" type="button" data-decor="fairyLights" aria-label="星星灯" data-tip="星星灯"></button>
            <button class="decor-chip decor-stars" type="button" data-decor="floorStars" aria-label="地板星光" data-tip="地板星光"></button>
            <button class="decor-chip decor-glow active" type="button" data-decor="softGlow" aria-label="暖光" data-tip="暖光"></button>
            <button class="decor-chip decor-keepsakes" type="button" data-decor="keepsakes" aria-label="纪念小物" data-tip="纪念小物"></button>
          </div>
        </div>
      </div>

      <div class="bond-stack" aria-label="成长">
        <span class="bond-mark level-mark" aria-hidden="true"></span>
        <strong id="profile-level">1</strong>
        <span class="bond-mark heart-mark" aria-hidden="true"></span>
        <strong id="profile-intimacy">0</strong>
      </div>

      <button id="refresh-life" class="refresh-button" type="button" aria-label="刷新" data-tip="刷新状态">↻</button>

      <div id="life-bubble" class="life-bubble">
        <span id="life-bubble-text">...</span>
      </div>

      <button class="game-launcher" id="game-launcher" aria-label="小游戏" data-tip="和Yoyo一起玩">🎮</button>
      <button class="concert-launcher" id="concert-launcher" aria-label="演唱会" data-tip="Let it go 演唱会！">🎤</button>
      <button class="wardrobe-launcher" id="wardrobe-launcher" aria-label="换装" data-tip="给Yoyo换装">👗</button>

      <!-- 换装抽屉 -->
      <div class="wardrobe-drawer" id="wardrobe-drawer" aria-hidden="true">
        <div class="wardrobe-header">
          <span class="wardrobe-title">✨ Yoyo 的衣橱</span>
          <button class="wardrobe-close" id="wardrobe-close" aria-label="关闭换装">✕</button>
        </div>
        <div class="wardrobe-tabs" id="wardrobe-tabs">
          <button class="wtab active" data-tab="hat">帽子</button>
          <button class="wtab" data-tab="face">表情</button>
          <button class="wtab" data-tab="clothes">衣服</button>
          <button class="wtab" data-tab="hair">发饰</button>
        </div>
        <div class="wardrobe-grid" id="wardrobe-grid"></div>
        <div class="wardrobe-actions">
          <button class="wardrobe-reset" id="wardrobe-reset">🔄 清除配件</button>
        </div>
      </div>

      <div class="game-menu" id="game-menu" aria-hidden="true">
        <button type="button" data-game="whackMole">🔨 打地鼠</button>
        <button type="button" data-game="catchFood">🍎 接食物</button>
        <button type="button" data-game="guessMood">💭 猜心情</button>
        <button type="button" data-game="spotDiff">🔍 找不同</button>
        <button type="button" data-game="rhythmPat">🎵 节奏拍</button>
      </div>

      <div class="game-overlay hidden" id="game-overlay" aria-hidden="true">
        <button class="game-close" id="game-close" aria-label="关闭游戏">✕</button>
        <div class="game-container" id="game-container"></div>
      </div>

      <div class="care-dock" id="care-actions" aria-label="照顾动作"></div>
      <div class="home-tip" id="home-tip" aria-hidden="true"></div>
    </section>
  </main>
  <script src="shared/yoyo-actions.js"></script>
  <script src="shared/home-scene.js"></script>
  <script src="home.js"></script>
  <script src="home-games.js"></script>
</body>
</html>
