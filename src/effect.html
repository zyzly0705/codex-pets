<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>Effect</title>
  <style>
    * { margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
    }
    /* 外层包裹：负责水平摇摆 */
    .particle-wrap {
      position: fixed;
      top: -60px;
      pointer-events: none;
      z-index: 99999;
      animation: sway ease-in-out infinite;
    }
    /* 内层：负责垂直下落 */
    .particle {
      display: block;
      animation: fall linear forwards;
    }
    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg) scale(1);
        opacity: 1;
      }
      80% {
        opacity: 1;
      }
      100% {
        transform: translateY(110vh) rotate(360deg) scale(0.6);
        opacity: 0;
      }
    }
    @keyframes sway {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(var(--sway-amt, 15px)); }
      75% { transform: translateX(calc(var(--sway-amt, 15px) * -1)); }
    }
  </style>
</head>
<body>
<script>
  const params = new URLSearchParams(window.location.search);
  const type = params.get('type') || 'flower';

  const EMOJIS = {
    flower: ['🌸', '🌺', '🌷', '💐', '🌹', '🏵️', '💮', '🌼'],
    candy: ['🍬', '🍭', '🍫', '🧁', '🎂', '🍰', '🍩', '🍪'],
    heart: ['❤️', '💕', '💖', '💗', '💝', '💓', '🩷', '🫶']
  };

  const emojis = EMOJIS[type] || EMOJIS.flower;
  const COUNT = 45;

  function createParticle(delay) {
    const wrap = document.createElement('div');
    wrap.className = 'particle-wrap';

    const el = document.createElement('span');
    el.className = 'particle';
    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];

    const x = Math.random() * 100;
    const size = 20 + Math.random() * 24;
    const duration = 2.5 + Math.random() * 3;
    const swayDuration = 1.5 + Math.random() * 2;
    const swayAmt = Math.round(10 + Math.random() * 20);

    wrap.style.left = x + 'vw';
    wrap.style.setProperty('--sway-amt', swayAmt + 'px');
    wrap.style.animationDuration = swayDuration + 's';
    wrap.style.animationDelay = delay + 's';

    el.style.fontSize = size + 'px';
    el.style.animationDuration = duration + 's';
    el.style.animationDelay = delay + 's';

    wrap.appendChild(el);
    document.body.appendChild(wrap);
  }

  for (let i = 0; i < COUNT; i++) {
    const delay = Math.random() * 3;
    createParticle(delay);
  }
</script>
</body>
</html>
