<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const logW = window.innerWidth;
  const logH = window.innerHeight;
  canvas.width = Math.round(logW * dpr);
  canvas.height = Math.round(logH * dpr);
  ctx.scale(dpr, dpr);

  const FRAME_W = 192;
  const FRAME_H = 208;
  const TOTAL_DURATION = 7600;
  const IDLE_ROW = 0;
  const IDLE_FRAMES = 6;
  const ASCENSION_ROW = 31;
  const ASCENSION_FRAMES = 8;
  const DHARMA_CHARGE_ROW = 33;
  const DHARMA_SPIRIT_ROW = 34;
  const DHARMA_MANIFEST_ROW = 35;
  const DHARMA_STABLE_ROW = 36;
  const DHARMA_FRAMES = 8;
  const FRAME_MS = 170;

  const sprite = new Image();
  let outfitLayers = [];
  let startTime = 0;
  let animating = false;
  let sourceCenter = { x: logW * 0.5, y: logH * 0.72 };
  let arenaCenter = { x: logW * 0.5, y: logH * 0.5 };
  let petSize = { w: 200, h: 260 };

  const particles = [];
  const arcBursts = [];
  const mistBands = [];
  const cloudBands = [];
  const lightningStrikes = [];

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  function mix(a, b, t) {
    return a + (b - a) * t;
  }

  function lerpPoint(a, b, t) {
    return { x: mix(a.x, b.x, t), y: mix(a.y, b.y, t) };
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutExpo(t) {
    return t === 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }

  function easeInExpo(t) {
    return t === 0 ? 0 : Math.pow(2, 10 * t - 10);
  }

  function segment(elapsed, start, end) {
    return clamp((elapsed - start) / (end - start), 0, 1);
  }

  function loadOutfitLayers(layerSources) {
    const sources = Array.isArray(layerSources) ? layerSources : [];
    return Promise.all(sources.map((layer) => new Promise((resolve) => {
      if (!layer || !layer.src) return resolve(null);
      const img = new Image();
      img.onload = () => resolve({ position: layer.position || 'front', image: img });
      img.onerror = () => resolve(null);
      img.src = layer.src;
    }))).then((layers) => {
      outfitLayers = layers.filter(Boolean);
    });
  }

  function drawLayerSet(position, col, row, drawW, drawH) {
    for (const layer of outfitLayers) {
      if (layer.position !== position || !layer.image.complete) continue;
      if ((row + 1) * FRAME_H > layer.image.naturalHeight || (col + 1) * FRAME_W > layer.image.naturalWidth) continue;
      ctx.drawImage(
        layer.image,
        col * FRAME_W, row * FRAME_H,
        FRAME_W, FRAME_H,
        -drawW / 2, -drawH / 2,
        drawW, drawH
      );
    }
  }

  function getLoopCol(now, frameCount) {
    return Math.floor((now / FRAME_MS) % frameCount);
  }

  function safeSpriteRow(row, fallback = IDLE_ROW) {
    if (!sprite.naturalHeight) return fallback;
    const maxRow = Math.floor(sprite.naturalHeight / FRAME_H) - 1;
    return row <= maxRow ? row : fallback;
  }

  function initScene() {
    particles.length = 0;
    arcBursts.length = 0;
    mistBands.length = 0;
    cloudBands.length = 0;
    lightningStrikes.length = 0;

    for (let i = 0; i < 86; i++) {
      const angle = Math.random() * Math.PI * 2;
      const outer = 140 + Math.random() * Math.min(logW, logH) * 0.26;
      particles.push({
        orbit: 70 + Math.random() * 140,
        angle,
        speed: 0.35 + Math.random() * 0.7,
        startX: sourceCenter.x + Math.cos(angle) * outer,
        startY: sourceCenter.y + Math.sin(angle) * outer,
        targetOffsetX: (Math.random() - 0.5) * 60,
        targetOffsetY: (Math.random() - 0.5) * 60,
        size: 1.4 + Math.random() * 3.2,
        alpha: 0.25 + Math.random() * 0.75,
        hue: Math.random() < 0.65 ? 188 + Math.random() * 18 : 42 + Math.random() * 10,
        pulse: Math.random() * Math.PI * 2,
      });
    }

    for (let i = 0; i < 6; i++) {
      mistBands.push({
        angle: i * (Math.PI / 3),
        radius: 110 + i * 24,
        width: 70 + i * 10,
        speed: 0.00022 + i * 0.00003,
        alpha: 0.05 + i * 0.015,
      });
    }

    for (let i = 0; i < 7; i++) {
      cloudBands.push({
        x: arenaCenter.x + (i - 3) * 120 + (Math.random() - 0.5) * 40,
        y: arenaCenter.y - 250 - Math.random() * 90,
        rx: 90 + Math.random() * 70,
        ry: 30 + Math.random() * 22,
        drift: 0.12 + Math.random() * 0.24,
        phase: Math.random() * Math.PI * 2,
      });
    }
  }

  function spawnArcBurst(elapsed) {
    arcBursts.push({
      bornAt: elapsed,
      duration: 520,
      seed: Math.random() * Math.PI * 2,
      radius: 120 + Math.random() * 120,
      span: Math.PI * (0.28 + Math.random() * 0.18),
    });
  }

  function spawnLightningStrike(elapsed) {
    const from = {
      x: arenaCenter.x + (Math.random() - 0.5) * 220,
      y: arenaCenter.y - 300 - Math.random() * 70,
    };
    const to = {
      x: arenaCenter.x + (Math.random() - 0.5) * 90,
      y: arenaCenter.y - 20 - Math.random() * 80,
    };
    lightningStrikes.push({
      bornAt: elapsed,
      duration: 220,
      from,
      to,
      seed: Math.random() * 1000,
    });
  }

  function drawBackdrop(elapsed) {
    const darkT = segment(elapsed, 300, 1700);
    const fadeT = 1 - segment(elapsed, 5600, TOTAL_DURATION);
    const alpha = 0.10 + darkT * 0.24 * fadeT;
    const vignette = ctx.createRadialGradient(arenaCenter.x, arenaCenter.y, 0, arenaCenter.x, arenaCenter.y, Math.max(logW, logH) * 0.72);
    vignette.addColorStop(0, `rgba(10, 18, 34, ${alpha * 0.38})`);
    vignette.addColorStop(0.55, `rgba(8, 18, 38, ${alpha * 0.78})`);
    vignette.addColorStop(1, `rgba(2, 6, 14, ${alpha})`);
    ctx.fillStyle = vignette;
    ctx.fillRect(0, 0, logW, logH);
  }

  function drawThunderClouds(elapsed, alpha) {
    if (alpha <= 0) return;
    const swell = 1 + Math.sin(elapsed * 0.0024) * 0.03;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const cloud of cloudBands) {
      const x = cloud.x + Math.sin(elapsed * 0.0008 * cloud.drift + cloud.phase) * 18;
      const y = cloud.y + Math.cos(elapsed * 0.0011 * cloud.drift + cloud.phase) * 8;
      const grad = ctx.createRadialGradient(x, y, 0, x, y, cloud.rx * 1.2);
      grad.addColorStop(0, `rgba(132, 208, 255, ${0.12 * alpha})`);
      grad.addColorStop(0.35, `rgba(55, 102, 160, ${0.16 * alpha})`);
      grad.addColorStop(1, 'rgba(8, 18, 38, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.ellipse(x, y, cloud.rx * swell, cloud.ry * swell, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(x - cloud.rx * 0.42, y + 8, cloud.rx * 0.58, cloud.ry * 0.92, -0.1, 0, Math.PI * 2);
      ctx.ellipse(x + cloud.rx * 0.36, y + 6, cloud.rx * 0.52, cloud.ry * 0.88, 0.12, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawSkyBeam(elapsed) {
    const beamT = segment(elapsed, 1500, 5200);
    if (beamT <= 0) return;
    const fade = 1 - segment(elapsed, 5200, TOTAL_DURATION);
    const width = mix(12, 200, easeOutExpo(beamT)) * fade;
    const beam = ctx.createLinearGradient(arenaCenter.x, 0, arenaCenter.x, logH);
    beam.addColorStop(0, `rgba(110, 236, 255, ${0.02 * fade})`);
    beam.addColorStop(0.2, `rgba(164, 244, 255, ${0.20 * fade})`);
    beam.addColorStop(0.5, `rgba(255, 228, 132, ${0.24 * fade})`);
    beam.addColorStop(0.8, `rgba(128, 230, 255, ${0.14 * fade})`);
    beam.addColorStop(1, 'rgba(90, 210, 255, 0)');
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = beam;
    ctx.fillRect(arenaCenter.x - width / 2, 0, width, logH);
    ctx.restore();
  }

  function drawHeavenEye(elapsed, alpha) {
    if (alpha <= 0) return;
    const cx = arenaCenter.x;
    const cy = arenaCenter.y - 292;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const aura = ctx.createRadialGradient(cx, cy, 0, cx, cy, 96);
    aura.addColorStop(0, `rgba(255, 242, 190, ${0.22 * alpha})`);
    aura.addColorStop(0.34, `rgba(128, 236, 255, ${0.20 * alpha})`);
    aura.addColorStop(1, 'rgba(80, 180, 255, 0)');
    ctx.fillStyle = aura;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 110, 34, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = `rgba(176, 246, 255, ${0.28 * alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 90, 22, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawConvergeBeam(from, to, alpha) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const offset = (i - 1.5) * 4;
      const grad = ctx.createLinearGradient(from.x, from.y, to.x, to.y);
      grad.addColorStop(0, `rgba(124, 232, 255, ${0.02 * alpha})`);
      grad.addColorStop(0.4, `rgba(138, 244, 255, ${0.20 * alpha})`);
      grad.addColorStop(1, `rgba(255, 224, 120, ${0.28 * alpha})`);
      ctx.strokeStyle = grad;
      ctx.lineWidth = 6 - i;
      ctx.beginPath();
      ctx.moveTo(from.x + offset, from.y);
      ctx.quadraticCurveTo(
        mix(from.x, to.x, 0.35) + offset * 3,
        mix(from.y, to.y, 0.35) - 90,
        to.x,
        to.y
      );
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawHaloMandala(center, radius, elapsed, alpha) {
    if (alpha <= 0) return;
    ctx.save();
    ctx.translate(center.x, center.y - radius * 0.10);
    ctx.rotate(elapsed * 0.00032);
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = `rgba(176, 245, 255, ${0.22 * alpha})`;
    ctx.lineWidth = 1.6;
    for (let ring = 0; ring < 3; ring++) {
      const rr = radius * (0.70 + ring * 0.12);
      ctx.beginPath();
      ctx.arc(0, 0, rr, 0, Math.PI * 2);
      ctx.stroke();
    }
    for (let i = 0; i < 16; i++) {
      const a = i * (Math.PI / 8);
      const inner = radius * 0.52;
      const outer = radius * 0.96;
      ctx.beginPath();
      ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawCharacter(center, scale, elapsed, alpha, rise, row, frameCount, tintAlpha, shadowColor, shadowBlur, smoothing) {
    row = safeSpriteRow(row, row >= DHARMA_CHARGE_ROW ? ASCENSION_ROW : IDLE_ROW);
    const col = getLoopCol(elapsed, frameCount);
    const drawW = FRAME_W * scale;
    const drawH = FRAME_H * scale;
    const y = center.y - rise;

    ctx.save();
    ctx.translate(center.x, y);
    ctx.globalAlpha = alpha;
    ctx.shadowColor = shadowColor;
    ctx.shadowBlur = shadowBlur;
    ctx.imageSmoothingEnabled = smoothing;
    drawLayerSet('behind', col, row, drawW, drawH);
    ctx.drawImage(
      sprite,
      col * FRAME_W, row * FRAME_H,
      FRAME_W, FRAME_H,
      -drawW / 2, -drawH / 2,
      drawW, drawH
    );
    drawLayerSet('front', col, row, drawW, drawH);
    if (tintAlpha > 0) {
      ctx.fillStyle = `rgba(170, 246, 255, ${tintAlpha})`;
      ctx.fillRect(-drawW / 2, -drawH / 2, drawW, drawH);
    }
    ctx.restore();
  }

  function drawSpirit(center, scale, elapsed, alpha, lift) {
    if (alpha <= 0) return;
    drawCharacter(
      center,
      scale,
      elapsed,
      alpha,
      lift,
      DHARMA_SPIRIT_ROW,
      DHARMA_FRAMES,
      0.14 * alpha,
      'rgba(144, 242, 255, 0.9)',
      34,
      false
    );
  }

  function drawMagicCircle(center, radius, elapsed, alpha) {
    const rot = elapsed * 0.00055;
    ctx.save();
    ctx.translate(center.x, center.y);
    ctx.rotate(rot);
    ctx.globalCompositeOperation = 'screen';
    ctx.strokeStyle = `rgba(122, 242, 255, ${0.34 * alpha})`;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.arc(0, 0, radius, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255, 224, 126, ${0.30 * alpha})`;
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.arc(0, 0, radius * 0.84, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < 12; i++) {
      const a = i * (Math.PI / 6);
      const inner = radius * 0.86;
      const outer = radius * 1.04;
      ctx.moveTo(Math.cos(a) * inner, Math.sin(a) * inner);
      ctx.lineTo(Math.cos(a) * outer, Math.sin(a) * outer);
    }
    ctx.stroke();

    ctx.rotate(-rot * 1.8);
    ctx.strokeStyle = `rgba(255, 250, 205, ${0.22 * alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const a = i * (Math.PI / 4);
      const px = Math.cos(a) * radius * 0.58;
      const py = Math.sin(a) * radius * 0.58;
      ctx.moveTo(px - 12, py);
      ctx.lineTo(px + 12, py);
      ctx.moveTo(px, py - 12);
      ctx.lineTo(px, py + 12);
    }
    ctx.stroke();
    ctx.restore();
  }

  function drawGroundLotus(center, radius, elapsed, alpha) {
    ctx.save();
    ctx.translate(center.x, center.y + radius * 0.30);
    ctx.globalCompositeOperation = 'screen';
    for (let i = 0; i < 10; i++) {
      const a = elapsed * 0.00045 + i * (Math.PI * 2 / 10);
      const px = Math.cos(a) * radius * 0.78;
      const py = Math.sin(a) * radius * 0.18;
      ctx.save();
      ctx.translate(px, py);
      ctx.rotate(a + Math.PI / 2);
      const petal = ctx.createLinearGradient(0, -radius * 0.18, 0, radius * 0.18);
      petal.addColorStop(0, `rgba(194, 246, 255, ${0.34 * alpha})`);
      petal.addColorStop(1, `rgba(255, 214, 116, ${0.08 * alpha})`);
      ctx.fillStyle = petal;
      ctx.beginPath();
      ctx.moveTo(0, -radius * 0.22);
      ctx.quadraticCurveTo(radius * 0.08, -radius * 0.06, 0, radius * 0.18);
      ctx.quadraticCurveTo(-radius * 0.08, -radius * 0.06, 0, -radius * 0.22);
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawMist(center, radius, elapsed, alpha) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const band of mistBands) {
      const a = elapsed * band.speed + band.angle;
      const x = center.x + Math.cos(a) * band.radius;
      const y = center.y + Math.sin(a * 1.2) * 18;
      const mist = ctx.createRadialGradient(x, y, 0, x, y, band.width);
      mist.addColorStop(0, `rgba(160, 236, 255, ${band.alpha * alpha})`);
      mist.addColorStop(0.65, `rgba(112, 190, 255, ${band.alpha * 0.55 * alpha})`);
      mist.addColorStop(1, 'rgba(80, 160, 220, 0)');
      ctx.fillStyle = mist;
      ctx.beginPath();
      ctx.ellipse(x, y, band.width, band.width * 0.38, a * 0.35, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawCoreGlow(center, radius, elapsed, alpha) {
    const pulse = 0.92 + Math.sin(elapsed * 0.0105) * 0.08;
    const glow = ctx.createRadialGradient(center.x, center.y, 0, center.x, center.y, radius);
    glow.addColorStop(0, `rgba(255, 250, 230, ${0.30 * alpha})`);
    glow.addColorStop(0.16, `rgba(255, 224, 126, ${0.24 * alpha})`);
    glow.addColorStop(0.5, `rgba(112, 235, 255, ${0.16 * alpha})`);
    glow.addColorStop(1, 'rgba(76, 196, 255, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(center.x - radius * pulse, center.y - radius * pulse, radius * 2 * pulse, radius * 2 * pulse);
  }

  function drawLightning(center, radius, elapsed, alpha) {
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    ctx.lineCap = 'round';
    for (let i = 0; i < 4; i++) {
      const startAngle = elapsed * 0.0016 + i * (Math.PI / 2);
      const endAngle = startAngle + Math.PI * (0.40 + i * 0.05);
      const points = [];
      const segments = 8;
      for (let s = 0; s <= segments; s++) {
        const t = s / segments;
        const a = mix(startAngle, endAngle, t);
        const r = radius * (0.90 + t * 0.56) + Math.sin(elapsed * 0.012 + i + s) * 16;
        points.push({
          x: center.x + Math.cos(a) * r,
          y: center.y + Math.sin(a) * r * 0.82,
        });
      }
      ctx.strokeStyle = `rgba(154, 246, 255, ${0.45 * alpha})`;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let s = 1; s < points.length; s++) ctx.lineTo(points[s].x, points[s].y);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 240, 188, ${0.24 * alpha})`;
      ctx.lineWidth = 1.1;
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFallingLightning(elapsed, alpha) {
    if (alpha <= 0) return;
    for (let i = lightningStrikes.length - 1; i >= 0; i--) {
      const strike = lightningStrikes[i];
      const t = clamp((elapsed - strike.bornAt) / strike.duration, 0, 1);
      if (t >= 1) {
        lightningStrikes.splice(i, 1);
        continue;
      }
      const localAlpha = (1 - t) * alpha;
      const points = [strike.from];
      const segments = 7;
      for (let s = 1; s < segments; s++) {
        const tt = s / segments;
        points.push({
          x: mix(strike.from.x, strike.to.x, tt) + (Math.sin(strike.seed + s * 1.7) * 18) * (1 - tt * 0.3),
          y: mix(strike.from.y, strike.to.y, tt) + (Math.random() - 0.5) * 8,
        });
      }
      points.push(strike.to);

      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.strokeStyle = `rgba(174, 248, 255, ${0.72 * localAlpha})`;
      ctx.lineWidth = 3.4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let s = 1; s < points.length; s++) ctx.lineTo(points[s].x, points[s].y);
      ctx.stroke();
      ctx.strokeStyle = `rgba(255, 243, 196, ${0.42 * localAlpha})`;
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawArcBursts(center, elapsed, alpha) {
    for (let i = arcBursts.length - 1; i >= 0; i--) {
      const burst = arcBursts[i];
      const t = clamp((elapsed - burst.bornAt) / burst.duration, 0, 1);
      if (t >= 1) {
        arcBursts.splice(i, 1);
        continue;
      }
      const localAlpha = (1 - t) * alpha;
      ctx.save();
      ctx.translate(center.x, center.y);
      ctx.rotate(burst.seed + t * 0.45);
      ctx.globalCompositeOperation = 'screen';
      ctx.strokeStyle = `rgba(255, 228, 124, ${0.24 * localAlpha})`;
      ctx.lineWidth = 2.8 * (1 - t * 0.35);
      ctx.beginPath();
      ctx.arc(0, 0, burst.radius + t * 80, -burst.span / 2, burst.span / 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  function updateAndDrawParticles(elapsed, focus, phaseAlpha) {
    const chargeT = segment(elapsed, 0, 1300);
    const travelT = segment(elapsed, 1300, 2600);
    const manifestT = segment(elapsed, 2400, 6000);
    const disperseT = segment(elapsed, 6000, TOTAL_DURATION);
    const orbitCenter = lerpPoint(sourceCenter, arenaCenter, easeInOutCubic(travelT));

    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    for (const p of particles) {
      let x = p.startX;
      let y = p.startY;
      let alpha = p.alpha * phaseAlpha;

      if (chargeT < 1) {
        x = mix(p.startX, sourceCenter.x + p.targetOffsetX, easeOutCubic(chargeT));
        y = mix(p.startY, sourceCenter.y + p.targetOffsetY, easeOutCubic(chargeT));
        alpha *= 0.4 + chargeT * 0.8;
      } else if (travelT < 1) {
        const path = lerpPoint(
          { x: sourceCenter.x + p.targetOffsetX, y: sourceCenter.y + p.targetOffsetY },
          { x: arenaCenter.x + Math.cos(p.angle) * (20 + p.orbit * 0.18), y: arenaCenter.y + Math.sin(p.angle) * 28 },
          easeInOutCubic(travelT)
        );
        x = path.x;
        y = path.y;
      } else if (disperseT > 0) {
        const spread = easeOutCubic(disperseT);
        x = orbitCenter.x + Math.cos(p.angle + elapsed * p.speed * 0.002) * (p.orbit + spread * 260);
        y = orbitCenter.y + Math.sin(p.angle + elapsed * p.speed * 0.002) * (p.orbit * 0.38 + spread * 120);
        alpha *= 1 - spread;
      } else {
        x = orbitCenter.x + Math.cos(p.angle + elapsed * p.speed * 0.0018) * (p.orbit + Math.sin(elapsed * 0.002 + p.pulse) * 12);
        y = orbitCenter.y + Math.sin(p.angle + elapsed * p.speed * 0.0021) * (p.orbit * 0.42 + Math.cos(elapsed * 0.002 + p.pulse) * 8);
        alpha *= 0.55 + manifestT * 0.45;
      }

      ctx.fillStyle = p.hue > 100
        ? `hsla(${p.hue}, 100%, 72%, ${alpha})`
        : `hsla(${p.hue}, 100%, 68%, ${alpha})`;
      ctx.shadowColor = p.hue > 100 ? 'rgba(126, 238, 255, 0.9)' : 'rgba(255, 226, 140, 0.9)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(x, y, p.size * (0.82 + Math.sin(elapsed * 0.005 + p.pulse) * 0.16), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawPet(center, scale, elapsed, alpha, rise, row = IDLE_ROW, frameCount = IDLE_FRAMES, tintAlpha = 0) {
    drawCharacter(
      center,
      scale,
      elapsed,
      alpha,
      rise,
      row,
      frameCount,
      tintAlpha,
      'rgba(140, 236, 255, 0.46)',
      28,
      false
    );
  }

  function animate(now) {
    if (!animating) return;
    const elapsed = now - startTime;
    if (elapsed >= TOTAL_DURATION) {
      animating = false;
      try { window.close(); } catch (e) {}
      return;
    }

    ctx.clearRect(0, 0, logW, logH);
    drawBackdrop(elapsed);

    const baseScale = petSize.w / FRAME_W;
    const chargeT = segment(elapsed, 0, 1300);
    const travelT = segment(elapsed, 1300, 2600);
    const summonSpiritT = segment(elapsed, 1650, 3000);
    const mergeSpiritT = segment(elapsed, 3000, 4200);
    const manifestT = segment(elapsed, 2400, 6000);
    const disperseT = segment(elapsed, 6000, TOTAL_DURATION);
    const travelPos = lerpPoint(sourceCenter, arenaCenter, easeInOutCubic(travelT));
    const phaseAlpha = 1 - segment(elapsed, 6800, TOTAL_DURATION);
    const giantScale = mix(baseScale, baseScale * 5.4, easeOutExpo(manifestT)) * (1 - disperseT * 0.28);
    const rise = mix(0, giantScale * 18, manifestT) * (1 - disperseT);
    const cloudT = segment(elapsed, 1200, 6200) * phaseAlpha;
    const heavenEyeT = segment(elapsed, 1800, 5600) * phaseAlpha;
    const spiritAlpha = summonSpiritT > 0
      ? (summonSpiritT < 1 ? summonSpiritT * 0.88 : (1 - mergeSpiritT) * 0.88)
      : 0;
    const spiritScale = baseScale * mix(0.88, 1.65, easeOutCubic(summonSpiritT));
    const spiritCenter = {
      x: mix(sourceCenter.x, arenaCenter.x, easeInOutCubic(summonSpiritT)),
      y: mix(sourceCenter.y - 28, arenaCenter.y - giantScale * 0.9, easeOutCubic(summonSpiritT)),
    };
    const spiritLift = 20 + Math.sin(elapsed * 0.006) * 8;

    if (Math.floor(elapsed / 560) !== Math.floor((elapsed - 16) / 560) && elapsed > 2100 && elapsed < 5600) {
      spawnLightningStrike(elapsed);
    }

    if (Math.floor(elapsed / 240) !== Math.floor((elapsed - 16) / 240) && elapsed > 2200 && elapsed < 5600) {
      spawnArcBurst(elapsed);
    }

    if (chargeT > 0 && chargeT < 1) {
      drawCoreGlow(sourceCenter, 70 + chargeT * 48, elapsed, chargeT * 0.8);
    }

    if (travelT > 0 && travelT < 1) {
      drawConvergeBeam(sourceCenter, travelPos, 0.9);
    }

    drawThunderClouds(elapsed, cloudT);
    drawHeavenEye(elapsed, heavenEyeT);
    drawSkyBeam(elapsed);
    updateAndDrawParticles(elapsed, arenaCenter, phaseAlpha);
    drawFallingLightning(elapsed, cloudT);

    if (manifestT > 0) {
      const circleAlpha = (0.28 + manifestT * 0.72) * phaseAlpha;
      drawMist(arenaCenter, 180 + giantScale * 18, elapsed, circleAlpha);
      drawCoreGlow(arenaCenter, giantScale * 58, elapsed, circleAlpha);
      drawMagicCircle(arenaCenter, giantScale * 42, elapsed, circleAlpha);
      drawMagicCircle(arenaCenter, giantScale * 56, -elapsed * 0.84, circleAlpha * 0.78);
      drawGroundLotus(arenaCenter, giantScale * 54, elapsed, circleAlpha * 0.88);
      drawHaloMandala(arenaCenter, giantScale * 44, elapsed, circleAlpha * 0.72);
      drawLightning(arenaCenter, giantScale * 54, elapsed, circleAlpha);
      drawArcBursts(arenaCenter, elapsed, circleAlpha);
    }

    if (spiritAlpha > 0.01) {
      drawSpirit(spiritCenter, spiritScale, elapsed, spiritAlpha, spiritLift);
      drawConvergeBeam(spiritCenter, arenaCenter, 0.26 + (1 - mergeSpiritT) * 0.32);
    }

    if (travelT < 1) {
      const travelScale = mix(baseScale, baseScale * 1.8, easeOutCubic(travelT));
      const chargeRowT = segment(elapsed, 520, 1800);
      const travelRow = chargeRowT > 0.2 ? DHARMA_CHARGE_ROW : IDLE_ROW;
      const travelFrames = chargeRowT > 0.2 ? DHARMA_FRAMES : IDLE_FRAMES;
      const travelTint = chargeRowT > 0.2 ? 0.025 + chargeRowT * 0.035 : 0;
      drawPet(travelPos, travelScale, elapsed, 1, chargeT * 8, travelRow, travelFrames, travelTint);
    } else {
      const bodyAlpha = spiritAlpha > 0.4 ? 0.86 : phaseAlpha;
      const manifestBias = segment(elapsed, 2450, 4100);
      const stableBias = segment(elapsed, 4100, 5900);
      const row = stableBias > 0.18
        ? DHARMA_STABLE_ROW
        : manifestBias > 0.12
          ? DHARMA_MANIFEST_ROW
          : DHARMA_CHARGE_ROW;
      const frames = DHARMA_FRAMES;
      const tint = 0.025 + Math.max(manifestBias, stableBias) * 0.055;
      drawPet(arenaCenter, giantScale, elapsed, bodyAlpha, rise, row, frames, tint);
    }

    requestAnimationFrame(animate);
  }

  window.startGiantEffect = function() {
    if (window.petCharCenter) {
      sourceCenter = { x: window.petCharCenter.x, y: window.petCharCenter.y };
    }
    if (window.effectArenaCenter) {
      arenaCenter = { x: window.effectArenaCenter.x, y: window.effectArenaCenter.y };
    }
    if (window.petSize) {
      petSize = { w: window.petSize.w || 200, h: window.petSize.h || 260 };
    }
    initScene();

    let started = false;
    function begin() {
      if (started) return;
      started = true;
      startTime = performance.now();
      animating = true;
      requestAnimationFrame(animate);
    }

    sprite.onload = () => loadOutfitLayers(window.outfitLayerSources).then(begin);
    sprite.src = window.spritesheetSrc || '../assets/yoyo/spritesheet.webp';
    if (sprite.complete && sprite.naturalWidth) loadOutfitLayers(window.outfitLayerSources).then(begin);
  };

  sprite.onerror = function() {
    setTimeout(() => { try { window.close(); } catch (e) {} }, 4000);
  };

  setTimeout(function() {
    if (!animating) {
      try { window.close(); } catch (e) {}
    }
  }, 5600);
})();
</script>
</body>
</html>
