<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  canvas { width: 100%; height: 100%; }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<script>
(function() {
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // Spritesheet 配置
  const COLS = 8;
  const ROWS = 26;
  const FRAME_W = 192;
  const FRAME_H = 208;
  const TOTAL_DURATION = 6000;

  const sprite = new Image();
  sprite.src = '../assets/xiao-hong/spritesheet.webp';

  // 宠物位置（由主进程注入）
  let petPos = { x: 0, y: 0 };
  let petSize = { w: 200, h: 260 };

  // 动画状态
  let startTime = 0;
  let animating = false;

  // 粒子系统（最多20个）
  const MAX_PARTICLES = 20;
  let particles = [];

  // 能量波纹
  let ripples = [];

  // 缓动函数
  function easeOutBack(t) {
    const c1 = 1.70158;
    const c3 = c1 + 1;
    return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
  }

  function easeInOutCubic(t) {
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function easeOutCubic(t) {
    return 1 - Math.pow(1 - t, 3);
  }

  // 初始化粒子
  function initParticles(cx, cy) {
    particles = [];
    for (let i = 0; i < MAX_PARTICLES; i++) {
      const angle = (i / MAX_PARTICLES) * Math.PI * 2 + Math.random() * 0.3;
      const dist = 100 + Math.random() * 150;
      particles.push({
        // 起始位置（外围）
        startX: cx + Math.cos(angle) * dist,
        startY: cy + Math.sin(angle) * dist,
        // 目标（中心）
        targetX: cx + (Math.random() - 0.5) * 20,
        targetY: cy + (Math.random() - 0.5) * 20,
        // 散射目标（阶段4用）
        scatterX: cx + Math.cos(angle) * (200 + Math.random() * 200),
        scatterY: cy + Math.sin(angle) * (200 + Math.random() * 200),
        size: 2 + Math.random() * 3,
        opacity: 1,
        hue: 40 + Math.random() * 20, // 金色系
        phase: Math.random() * Math.PI * 2
      });
    }
  }

  // 绘制宠物帧
  function drawPet(cx, cy, scale, shake) {
    const row = 0; // idle 第一行
    const col = Math.floor((performance.now() / 200) % 3); // 简单帧动画
    const drawW = FRAME_W * scale;
    const drawH = FRAME_H * scale;
    const offsetX = shake ? (Math.random() - 0.5) * 4 : 0;
    const offsetY = shake ? (Math.random() - 0.5) * 4 : 0;

    ctx.save();
    ctx.translate(cx + offsetX, cy + offsetY);
    ctx.drawImage(
      sprite,
      col * FRAME_W, row * FRAME_H,
      FRAME_W, FRAME_H,
      -drawW / 2, -drawH / 2,
      drawW, drawH
    );
    ctx.restore();
  }

  // 绘制金色光晕
  function drawGlow(cx, cy, radius, intensity) {
    const gradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    gradient.addColorStop(0, `rgba(255, 215, 0, ${0.3 * intensity})`);
    gradient.addColorStop(0.5, `rgba(255, 180, 0, ${0.15 * intensity})`);
    gradient.addColorStop(1, `rgba(255, 150, 0, 0)`);
    ctx.fillStyle = gradient;
    ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);
  }

  // 绘制粒子
  function drawParticles() {
    for (const p of particles) {
      if (p.opacity <= 0) continue;
      ctx.save();
      ctx.globalAlpha = p.opacity;
      ctx.fillStyle = `hsl(${p.hue}, 100%, 60%)`;
      ctx.shadowColor = `hsl(${p.hue}, 100%, 70%)`;
      ctx.shadowBlur = 6;
      ctx.beginPath();
      ctx.arc(p.x || p.startX, p.y || p.startY, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // 绘制能量波纹
  function drawRipples() {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const r = ripples[i];
      if (r.opacity <= 0) {
        ripples.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = r.opacity;
      ctx.strokeStyle = `rgba(255, 200, 50, ${r.opacity})`;
      ctx.lineWidth = 3 * r.opacity;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
      r.radius += 4;
      r.opacity -= 0.02;
    }
  }

  // 绘制气泡文字
  function drawBubble(cx, cy, text) {
    ctx.save();
    ctx.font = 'bold 28px "Microsoft YaHei", sans-serif';
    const metrics = ctx.measureText(text);
    const tw = metrics.width;
    const padding = 16;
    const bx = cx - tw / 2 - padding;
    const by = cy - 60;
    const bw = tw + padding * 2;
    const bh = 44;

    // 气泡背景
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.shadowColor = 'rgba(255, 180, 0, 0.4)';
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 12);
    ctx.fill();

    // 小三角
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(cx - 8, by + bh);
    ctx.lineTo(cx, by + bh + 10);
    ctx.lineTo(cx + 8, by + bh);
    ctx.closePath();
    ctx.fill();

    // 文字
    ctx.fillStyle = '#d4760a';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, cx, by + bh / 2);
    ctx.restore();
  }

  // 主动画循环
  function animate(now) {
    if (!animating) return;

    const elapsed = now - startTime;

    if (elapsed >= TOTAL_DURATION) {
      animating = false;
      try { window.close(); } catch(e) {}
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cx = petPos.x + petSize.w / 2;
    const cy = petPos.y + petSize.h / 2;
    const baseScale = petSize.w / FRAME_W; // 正常大小约 ~1.04

    if (elapsed < 1000) {
      // ===== 阶段1：蓄力（0-1s）=====
      const t = elapsed / 1000;

      // 粒子向中心汇聚
      for (const p of particles) {
        p.x = p.startX + (p.targetX - p.startX) * easeInOutCubic(t);
        p.y = p.startY + (p.targetY - p.startY) * easeInOutCubic(t);
        p.opacity = 0.5 + t * 0.5;
        p.size = (2 + Math.random() * 3) * (1 - t * 0.3);
      }

      // 微弱光晕渐显
      drawGlow(cx, cy, 80 + t * 40, t * 0.5);
      drawParticles();
      // 绘制宠物（抖动）
      drawPet(cx, cy, baseScale, true);

    } else if (elapsed < 3000) {
      // ===== 阶段2：膨胀（1-3s）=====
      const t = (elapsed - 1000) / 2000;
      const easedT = easeOutBack(t);
      const targetScale = baseScale * 6;
      const currentScale = baseScale + (targetScale - baseScale) * easedT;

      // 背景模糊效果
      ctx.save();
      ctx.filter = `blur(${Math.min(t * 2, 1.5)}px)`;
      ctx.fillStyle = `rgba(0, 0, 0, ${t * 0.08})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      // 金色光晕扩大
      const glowRadius = currentScale * FRAME_W * 0.6;
      drawGlow(cx, cy, glowRadius, 0.6 + t * 0.4);

      // 粒子环绕
      for (const p of particles) {
        const angle = p.phase + elapsed * 0.002;
        const dist = 30 + currentScale * FRAME_W * 0.4;
        p.x = cx + Math.cos(angle) * dist;
        p.y = cy + Math.sin(angle) * dist;
        p.opacity = 0.8;
        p.size = 2 + Math.sin(elapsed * 0.005 + p.phase) * 1.5;
      }
      drawParticles();
      drawPet(cx, cy, currentScale, false);

    } else if (elapsed < 4500) {
      // ===== 阶段3：巨人展示（3-4.5s）=====
      const t = (elapsed - 3000) / 1500;
      // 呼吸感起伏 scale 5.8~6.2
      const breathScale = baseScale * (5.8 + 0.4 * Math.sin(t * Math.PI * 4));

      // 背景
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      // 金色光环脉冲
      const pulseIntensity = 0.6 + 0.3 * Math.sin(t * Math.PI * 6);
      const glowRadius = breathScale * FRAME_W * 0.6;
      drawGlow(cx, cy, glowRadius, pulseIntensity);

      // 粒子环绕
      for (const p of particles) {
        const angle = p.phase + elapsed * 0.0015;
        const dist = breathScale * FRAME_W * 0.45;
        p.x = cx + Math.cos(angle) * dist;
        p.y = cy + Math.sin(angle) * dist;
        p.opacity = 0.6 + 0.3 * Math.sin(elapsed * 0.003 + p.phase);
        p.size = 3 + Math.sin(elapsed * 0.004 + p.phase) * 2;
      }
      drawParticles();
      drawPet(cx, cy, breathScale, false);

      // 气泡 "法天象地！"
      drawBubble(cx, cy - breathScale * FRAME_H * 0.5 - 20, '法天象地！');

      // 周期性波纹
      if (Math.floor(elapsed / 400) !== Math.floor((elapsed - 16) / 400)) {
        ripples.push({ x: cx, y: cy, radius: breathScale * FRAME_W * 0.3, opacity: 0.5 });
      }
      drawRipples();

    } else {
      // ===== 阶段4：收缩消散（4.5-6s）=====
      const t = (elapsed - 4500) / 1500;
      const easedT = easeOutCubic(t);
      const currentScale = baseScale * 6 * (1 - easedT) + baseScale * easedT;

      // 背景渐隐
      ctx.save();
      ctx.fillStyle = `rgba(0, 0, 0, ${0.08 * (1 - t)})`;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.restore();

      // 光晕收缩
      const glowRadius = currentScale * FRAME_W * 0.5;
      drawGlow(cx, cy, glowRadius, (1 - easedT) * 0.8);

      // 粒子向外散射
      for (const p of particles) {
        p.x = cx + (p.scatterX - cx) * easedT;
        p.y = cy + (p.scatterY - cy) * easedT;
        p.opacity = 1 - easedT;
        p.size = (3 + Math.random()) * (1 - easedT);
      }
      drawParticles();
      drawPet(cx, cy, currentScale, false);

      // 释放能量波纹（初期）
      if (t < 0.3 && Math.floor(elapsed / 200) !== Math.floor((elapsed - 16) / 200)) {
        ripples.push({ x: cx, y: cy, radius: currentScale * FRAME_W * 0.2, opacity: 0.7 });
      }
      drawRipples();
    }

    requestAnimationFrame(animate);
  }

  // 启动入口（由主进程调用）
  window.startGiantEffect = function() {
    if (window.petPosition) {
      petPos.x = window.petPosition.x;
      petPos.y = window.petPosition.y;
    }
    if (window.petSize) {
      petSize.w = window.petSize.w;
      petSize.h = window.petSize.h;
    }
    initParticles(petPos.x + petSize.w / 2, petPos.y + petSize.h / 2);
    startTime = performance.now();
    animating = true;
    requestAnimationFrame(animate);
  };

  sprite.onload = function() {
    // 等待主进程注入位置后调用 startGiantEffect
  };

  // 图片加载失败保护
  sprite.onerror = function() {
    setTimeout(function() { try { window.close(); } catch(e) {} }, 5000);
  };

  // 如果5秒内未收到启动信号，自动关闭
  setTimeout(function() {
    if (!animating) {
      try { window.close(); } catch(e) {}
    }
  }, 5000);
})();
</script>
</body>
</html>
