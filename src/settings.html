<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Yoyo 设置</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; padding: 16px; background: #fff5f5; margin: 0; }
    h2 { color: #e91e63; margin: 0 0 14px; font-size: 18px; }

    .card { margin-bottom: 10px; padding: 12px 14px; background: white; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    .card-title { font-size: 11px; font-weight: 600; color: #aaa; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }

    .row { display: flex; align-items: center; justify-content: space-between; min-height: 28px; }
    .row + .row { margin-top: 8px; }
    .label { font-size: 13px; color: #333; }
    .desc { font-size: 11px; color: #aaa; margin-top: 2px; }

    /* toggle */
    .toggle { position: relative; width: 36px; height: 20px; flex-shrink: 0; }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle .slider { position: absolute; inset: 0; background: #ccc; border-radius: 20px; transition: .25s; }
    .toggle .slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 2px; top: 2px; background: white; border-radius: 50%; transition: .25s; }
    .toggle input:checked + .slider { background: #e91e63; }
    .toggle input:checked + .slider:before { transform: translateX(16px); }

    select { padding: 3px 6px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; color: #333; background: white; }

    /* work hours */
    .time-row { display: flex; align-items: center; gap: 6px; }
    .time-row span { font-size: 12px; color: #888; }
    .time-sel { padding: 3px 5px; border-radius: 6px; border: 1px solid #ddd; font-size: 13px; background: white; color: #333; }

    /* stats */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .stat-box { background: #fff5f5; border-radius: 8px; padding: 8px 10px; text-align: center; }
    .stat-num { font-size: 20px; font-weight: 700; color: #e91e63; line-height: 1; }
    .stat-label { font-size: 11px; color: #aaa; margin-top: 2px; }
    .memory-line { font-size: 12px; color: #555; line-height: 1.45; background: #fff5f5; border-radius: 8px; padding: 8px 10px; }
    .mini-list { font-size: 11px; color: #999; line-height: 1.6; margin-top: 6px; }
    .memory-card { border-top: 1px solid #f5d5df; padding-top: 6px; margin-top: 6px; font-size: 11px; color: #777; line-height: 1.45; }
    .level-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .level-badge { background: linear-gradient(135deg, #e91e63, #ff6090); color: white; border-radius: 8px; padding: 4px 10px; font-size: 13px; font-weight: 600; }
    .xp-bar-wrap { flex: 1; background: #f0f0f0; border-radius: 6px; height: 8px; overflow: hidden; }
    .xp-bar-fill { height: 100%; background: linear-gradient(90deg, #e91e63, #ff6090); border-radius: 6px; transition: width .4s; }
    .xp-text { font-size: 11px; color: #aaa; text-align: right; margin-top: 2px; }
    .asset-pack-line { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 12px; color: #555; line-height: 1.5; }
    .asset-pack-line + .asset-pack-line { margin-top: 4px; }
    .asset-pack-value { color: #333; font-weight: 600; text-align: right; }
    .asset-pack-status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
    .asset-pack-pill { background: #fff5f5; border-radius: 8px; padding: 6px 4px; text-align: center; }
    .asset-pack-pill strong { display: block; color: #e91e63; font-size: 15px; line-height: 1; }
    .asset-pack-pill span { display: block; color: #999; font-size: 10px; margin-top: 2px; }
    .asset-pack-queue { margin-top: 8px; padding: 7px 9px; background: #fff5f5; border-radius: 8px; color: #666; font-size: 11px; line-height: 1.45; }

    /* danger */
    .danger-btn { width: 100%; padding: 9px; background: #f44336; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 13px; margin-top: 4px; }
    .danger-btn:hover { background: #d32f2f; }
    .secondary-btn { width: 100%; padding: 9px; background: #fff; color: #e91e63; border: 1px solid #ffc1d6; border-radius: 8px; cursor: pointer; font-size: 13px; margin: 4px 0 8px; }
    .secondary-btn:hover { background: #fff5f5; }
  </style>
</head>
<body>
  <h2>🌸 Yoyo 设置</h2>

  <!-- 成长数据 -->
  <div class="card">
    <div class="card-title">Yoyo 成长</div>
    <div class="level-row">
      <div class="level-badge" id="levelBadge">Lv.1 小豆芽</div>
      <div style="flex:1">
        <div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpBar" style="width:0%"></div></div>
        <div class="xp-text" id="xpText">0 / 50 XP</div>
      </div>
    </div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num" id="statDays">—</div><div class="stat-label">陪伴天数</div></div>
      <div class="stat-box"><div class="stat-num" id="statStreak">—</div><div class="stat-label">连续签到</div></div>
    </div>
  </div>

  <!-- 关系与今日记忆 -->
  <div class="card">
    <div class="card-title">关系与今日</div>
    <div class="stat-grid">
      <div class="stat-box"><div class="stat-num" id="relStage">—</div><div class="stat-label">关系阶段</div></div>
      <div class="stat-box"><div class="stat-num" id="relTrust">—</div><div class="stat-label">信任</div></div>
    </div>
    <div class="memory-line" id="dailySummary" style="margin-top:8px;">今天还没有留下小记忆。</div>
    <div class="mini-list" id="planSummary"></div>
    <div id="memoryCards"></div>
  </div>

  <!-- 素材包状态 -->
  <div class="card" id="assetPackCard">
    <div class="card-title">素材包</div>
    <div class="asset-pack-line">
      <span>当前包</span>
      <span class="asset-pack-value" id="assetPackName">读取中</span>
    </div>
    <div class="asset-pack-line">
      <span>核心动作</span>
      <span class="asset-pack-value" id="assetPackGolden">—</span>
    </div>
    <div class="asset-pack-status" id="assetPackStatus">
      <div class="asset-pack-pill"><strong>—</strong><span>保留</span></div>
      <div class="asset-pack-pill"><strong>—</strong><span>待重画</span></div>
      <div class="asset-pack-pill"><strong>—</strong><span>实验</span></div>
    </div>
    <div class="desc" id="assetPackReport" style="margin-top:8px;">等待 QA 报告。</div>
    <div class="asset-pack-queue" id="assetPackRedrawQueue">待生产 0 项</div>
    <div class="asset-pack-queue" id="assetPackCandidates">候选来源 0 个</div>
  </div>

  <!-- 基础设置 -->
  <div class="card">
    <div class="card-title">基础</div>
    <div class="row">
      <div><div class="label">开机自启</div><div class="desc">开机时自动启动 Yoyo</div></div>
      <label class="toggle"><input type="checkbox" id="autoStart" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><div class="label">音效</div><div class="desc">脚步声、笑声等</div></div>
      <label class="toggle"><input type="checkbox" id="soundEnabled" checked><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><div class="label">AI 台词增强</div><div class="desc" id="aiStatusText">DeepSeek 短台词改写</div></div>
      <label class="toggle"><input type="checkbox" id="aiLinesEnabled" checked><span class="slider"></span></label>
    </div>
  </div>

  <!-- 提醒设置 -->
  <div class="card">
    <div class="card-title">提醒</div>
    <div class="row">
      <div class="label">提醒频率</div>
      <select id="reminderFreq">
        <option value="high">高（全部）</option>
        <option value="medium" selected>中（主要）</option>
        <option value="low">低（重要）</option>
      </select>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="label">上班时间</div>
      <div class="time-row">
        <select class="time-sel" id="workStartHour"></select>
        <span>:00</span>
      </div>
    </div>
    <div class="row">
      <div class="label">下班时间</div>
      <div class="time-row">
        <select class="time-sel" id="workEndHour"></select>
        <span>:00</span>
      </div>
    </div>
    <div class="desc" style="margin-top:6px;">Yoyo 会在上班前 10 分钟和下班时提醒你</div>
  </div>

  <!-- 行为设置 -->
  <div class="card">
    <div class="card-title">行为</div>
    <div class="row">
      <div><div class="label">Yoyo 活跃度</div><div class="desc">主动说话和行动的频率</div></div>
      <select id="activity">
        <option value="quiet">安静</option>
        <option value="normal" selected>正常</option>
        <option value="active">活泼</option>
      </select>
    </div>
    <div class="row" style="margin-top:10px;">
      <div><div class="label">工作模式</div><div class="desc">决定提醒强度和陪伴节奏</div></div>
      <select id="workMode">
        <option value="focus">专注中</option>
        <option value="balanced" selected>轻松工作</option>
        <option value="overtime">加班中</option>
        <option value="wrapup">准备收工</option>
      </select>
    </div>
  </div>

  <button class="secondary-btn" id="resetPreferenceBtn">清除行为偏好学习</button>
  <button class="danger-btn" id="resetBtn">重置所有数据</button>

  <script>
    const { ipcRenderer } = require('electron');

    // ===== 填充小时选项 =====
    function fillHourSelect(id, defaultVal) {
      const sel = document.getElementById(id);
      for (let h = 6; h <= 23; h++) {
        const opt = document.createElement('option');
        opt.value = h;
        opt.textContent = `${h}:00`;
        if (h === defaultVal) opt.selected = true;
        sel.appendChild(opt);
      }
    }
    fillHourSelect('workStartHour', 9);
    fillHourSelect('workEndHour', 18);

    function renderAssetPackSummary(pets) {
      const yoyo = (pets || []).find(pet => pet.id === 'yoyo') || (pets || []).find(pet => pet.assetPack);
      const assetPack = yoyo?.assetPack;
      if (!assetPack) {
        document.getElementById('assetPackName').textContent = '未发现素材包';
        document.getElementById('assetPackGolden').textContent = '—';
        document.getElementById('assetPackReport').textContent = '当前宠物仍使用旧 pet.json 模式。';
        document.getElementById('assetPackRedrawQueue').textContent = '待生产 0 项';
        document.getElementById('assetPackCandidates').textContent = '候选来源 0 个';
        return;
      }

      const counts = assetPack.inventorySummary?.statusCounts || {};
      const total = assetPack.inventorySummary?.total || 0;
      const uncovered = assetPack.inventorySummary?.uncovered;
      const redrawQueue = assetPack.redrawQueueSummary || {};
      const nextRedraw = redrawQueue.next;
      const candidateRegistry = assetPack.candidateRegistrySummary || {};
      const candidateCounts = candidateRegistry.dispositionCounts || {};
      document.getElementById('assetPackName').textContent = `${assetPack.displayName || assetPack.id} · ${assetPack.style}`;
      document.getElementById('assetPackGolden').textContent = `${assetPack.avatar?.goldenActions?.length || 0} 个 · ${assetPack.type}`;
      document.getElementById('assetPackStatus').innerHTML = `
        <div class="asset-pack-pill"><strong>${counts.keep || 0}</strong><span>保留</span></div>
        <div class="asset-pack-pill"><strong>${counts.redraw || 0}</strong><span>待重画</span></div>
        <div class="asset-pack-pill"><strong>${counts.experimental || 0}</strong><span>实验</span></div>
      `;
      document.getElementById('assetPackReport').textContent =
        `QA 覆盖 ${total} 个素材，未归类 ${uncovered ?? '—'} 个。报告：${assetPack.qa?.report || '未生成'}`;
      document.getElementById('assetPackRedrawQueue').textContent =
        `待生产 ${redrawQueue.total || counts.redraw || 0} 项，高优先级 ${redrawQueue.highPriority || 0} 项`
        + (nextRedraw ? `，下一项 ${nextRedraw.path}` : '');
      document.getElementById('assetPackCandidates').textContent =
        `候选来源 ${candidateRegistry.totalCandidates || 0} 个，正式候选 ${candidateCounts.candidate || 0} 个，基础素材 ${candidateCounts.base || 0} 个`;
    }

    ipcRenderer.invoke('pets:list')
      .then(renderAssetPackSummary)
      .catch(() => {
        document.getElementById('assetPackName').textContent = '读取失败';
        document.getElementById('assetPackReport').textContent = '素材包信息暂时不可用。';
        document.getElementById('assetPackRedrawQueue').textContent = '待生产队列读取失败。';
        document.getElementById('assetPackCandidates').textContent = '候选来源读取失败。';
      });

    // ===== 直接从统一 Store 加载所有数据 =====
    ipcRenderer.invoke('store:load').then(data => {
      const s = data.settings || {};
      document.getElementById('autoStart').checked    = s.autoStart !== false;
      document.getElementById('soundEnabled').checked = s.soundEnabled !== false;
      document.getElementById('aiLinesEnabled').checked = s.aiLinesEnabled !== false;
      document.getElementById('reminderFreq').value   = s.reminderFreq || 'medium';
      document.getElementById('activity').value       = s.activity || 'normal';
      document.getElementById('workMode').value       = s.workMode || 'balanced';
      document.getElementById('workStartHour').value  = s.workStartHour ?? 9;
      document.getElementById('workEndHour').value    = s.workEndHour ?? 18;

      // ===== 成长数据（直接从 store 读，无需 executeJavaScript）=====
      const LEVEL_NAMES = ['小豆芽', '小花苞', '小蝴蝶', '小公主', '小天使'];
      const LEVEL_XP    = [0, 50, 150, 350, 700];

      const growth  = data.growth  || { xp: 0, level: 1 };
      const memory  = data.memory  || { consecutiveDays: 0 };
      const firstDay = data.firstDay || Date.now();
      const companionDays = Math.floor((Date.now() - firstDay) / 86400000);

      const lv = Math.min(growth.level || 1, 5);
      const lvName = LEVEL_NAMES[lv - 1] || '小豆芽';
      document.getElementById('levelBadge').textContent = `Lv.${lv} ${lvName}`;
      const curXP  = growth.xp || 0;
      const minXP  = LEVEL_XP[lv - 1] || 0;
      const nextXP = LEVEL_XP[lv] || LEVEL_XP[LEVEL_XP.length - 1];
      const pct = lv >= 5 ? 100 : Math.min(100, Math.round((curXP - minXP) / (nextXP - minXP) * 100));
      document.getElementById('xpBar').style.width = pct + '%';
      document.getElementById('xpText').textContent = lv >= 5
        ? `${curXP} XP（满级）`
        : `${curXP - minXP} / ${nextXP - minXP} XP`;
      document.getElementById('statDays').textContent   = `${companionDays}`;
      document.getElementById('statStreak').textContent = `${memory.consecutiveDays ?? 0}`;

      const relationship = data.relationship || {};
      const stageNames = {
        first_meet: '初遇',
        familiar: '熟悉',
        attached: '依赖',
        tacit: '默契',
        exclusive: '专属',
      };
      document.getElementById('relStage').textContent = stageNames[relationship.stage] || '初遇';
      document.getElementById('relTrust').textContent = `${Math.round(relationship.trust ?? 60)}`;

      const daily = data.dailyMemory || {};
      const interactions = daily.interactions || {};
      const summary = daily.summaryLine
        || `今天摸摸 ${interactions.pet || 0} 次，喂食 ${interactions.feed || 0} 次。`;
      document.getElementById('dailySummary').textContent = summary;

      const plan = data.companionPlan || {};
      const budgets = plan.budgets || {};
      const used = plan.used || {};
      document.getElementById('planSummary').textContent =
        `今日节奏：${plan.mode || '未生成'} · 说话 ${used.talk || 0}/${budgets.talk || 0} · 玩耍 ${used.play || 0}/${budgets.play || 0}`;

      const cards = [data.dailyMemory, ...(data.dailyCards || [])]
        .filter(Boolean)
        .filter((item, index, arr) => arr.findIndex(other => other.date === item.date) === index)
        .slice(0, 7);
      document.getElementById('memoryCards').innerHTML = cards.map(card => {
        const line = card.summaryLine || '这一天还没有写完小日记。';
        const petCount = card.petCount ?? card.interactions?.pet ?? 0;
        const activeMinutes = card.activeMinutes || 0;
        return `<div class="memory-card">${card.date || '今天'} · 陪伴 ${activeMinutes} 分钟 · 摸摸 ${petCount} 次<br>${line}</div>`;
      }).join('');
    });

    ipcRenderer.invoke('ai:status').then(status => {
      const text = status.configured
        ? `DeepSeek 已配置：${status.model}`
        : '未配置 API Key 时自动使用本地台词';
      document.getElementById('aiStatusText').textContent = text;
    });

    // ===== 保存设置 =====
    function save() {
      ipcRenderer.invoke('settings:save', {
        autoStart:      document.getElementById('autoStart').checked,
        soundEnabled:   document.getElementById('soundEnabled').checked,
        aiLinesEnabled: document.getElementById('aiLinesEnabled').checked,
        reminderFreq:   document.getElementById('reminderFreq').value,
        activity:       document.getElementById('activity').value,
        workMode:       document.getElementById('workMode').value,
        workStartHour:  parseInt(document.getElementById('workStartHour').value),
        workEndHour:    parseInt(document.getElementById('workEndHour').value),
      });
    }
    document.querySelectorAll('input, select').forEach(el => el.addEventListener('change', save));

    document.getElementById('resetPreferenceBtn').addEventListener('click', () => {
      if (confirm('只清除 Yoyo 学到的行为偏好，成长和记忆会保留。确定吗？')) {
        ipcRenderer.invoke('preferences:reset-behavior');
      }
    });

    // ===== 重置 =====
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('确定要重置所有数据吗？Yoyo 的记忆和成长都会消失...')) {
        ipcRenderer.invoke('settings:reset');
      }
    });
  </script>
</body>
</html>
