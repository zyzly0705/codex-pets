<svg xmlns="http://www.w3.org/2000/svg" width="64" height="44" viewBox="0 0 64 44">
  <!-- Left sleepy eye (half closed, drooping) -->
  <path d="M14 22 Q20 26 26 22" fill="#c8b0b0" stroke="#2d1a2e" stroke-width="1.5"/>
  <path d="M14 22 Q20 18 26 22" fill="none" stroke="#2d1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right sleepy eye -->
  <path d="M38 22 Q44 26 50 22" fill="#c8b0b0" stroke="#2d1a2e" stroke-width="1.5"/>
  <path d="M38 22 Q44 18 50 22" fill="none" stroke="#2d1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Small tired mouth / yawn -->
  <ellipse cx="32" cy="34" rx="5" ry="5.5" fill="#cc4444" stroke="#2d1a2e" stroke-width="1.5"/>
  <ellipse cx="32" cy="34" rx="3.5" ry="2.5" fill="#aa2222"/>
  <!-- ZZZ -->
  <text x="46" y="20" font-family="sans-serif" font-size="7" font-weight="bold" fill="#8888cc" opacity="0.85">Z</text>
  <text x="51" y="14" font-family="sans-serif" font-size="5.5" font-weight="bold" fill="#8888cc" opacity="0.7">z</text>
  <text x="55" y="9" font-family="sans-serif" font-size="4" font-weight="bold" fill="#8888cc" opacity="0.55">z</text>
  <!-- Soft blush from tiredness -->
  <ellipse cx="10" cy="28" rx="6" ry="3.5" fill="#ffccbb" opacity="0.4"/>
  <ellipse cx="54" cy="28" rx="6" ry="3.5" fill="#ffccbb" opacity="0.4"/>
</svg>
