<svg xmlns="http://www.w3.org/2000/svg" width="80" height="28" viewBox="0 0 80 28">
  <!-- Collar band suggestion -->
  <rect x="10" y="12" width="60" height="5" rx="2.5" fill="#1a1a2e" opacity="0.3"/>
  <!-- Left wing of bow tie -->
  <path d="M38 14 L28 8 L28 20 Z" fill="#c62828" stroke="#8b0000" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M38 14 L30 9 L31 12" fill="none" stroke="rgba(255,100,100,0.5)" stroke-width="1" stroke-linecap="round"/>
  <!-- Right wing of bow tie -->
  <path d="M42 14 L52 8 L52 20 Z" fill="#c62828" stroke="#8b0000" stroke-width="1.5" stroke-linejoin="round"/>
  <path d="M42 14 L50 9 L49 12" fill="none" stroke="rgba(255,100,100,0.5)" stroke-width="1" stroke-linecap="round"/>
  <!-- Center knot -->
  <ellipse cx="40" cy="14" rx="4.5" ry="5" fill="#b71c1c" stroke="#7f0000" stroke-width="1.2"/>
  <ellipse cx="39" cy="12.5" rx="1.8" ry="1.5" fill="rgba(255,150,150,0.6)"/>
  <!-- Collar dots (decorative) -->
  <circle cx="20" cy="15" r="1" fill="rgba(255,255,255,0.3)"/>
  <circle cx="60" cy="15" r="1" fill="rgba(255,255,255,0.3)"/>
</svg>
