<svg xmlns="http://www.w3.org/2000/svg" width="80" height="32" viewBox="0 0 80 32">
  <!-- Scarf wrap body -->
  <rect x="4" y="9" width="72" height="7" rx="3.5" fill="#e53935"/>
  <rect x="4" y="14" width="72" height="5" rx="2.5" fill="#c62828"/>
  <rect x="4" y="9" width="72" height="3" rx="1.5" fill="#ef9a9a"/>
  <!-- Color stripes on wrap -->
  <rect x="10" y="10" width="6" height="5" rx="1" fill="#ff8f00" opacity="0.7"/>
  <rect x="20" y="10" width="6" height="5" rx="1" fill="#ffd54f" opacity="0.7"/>
  <rect x="30" y="10" width="6" height="5" rx="1" fill="#66bb6a" opacity="0.7"/>
  <rect x="40" y="10" width="6" height="5" rx="1" fill="#29b6f6" opacity="0.7"/>
  <rect x="50" y="10" width="6" height="5" rx="1" fill="#9575cd" opacity="0.7"/>
  <rect x="60" y="10" width="6" height="5" rx="1" fill="#ff8f00" opacity="0.7"/>
  <!-- Knot on left side -->
  <ellipse cx="12" cy="16" rx="6" ry="5" fill="#e53935" stroke="#b71c1c" stroke-width="1.2"/>
  <ellipse cx="10" cy="14" rx="2.5" ry="2" fill="#ef5350" opacity="0.8"/>
  <!-- Hanging tail -->
  <path d="M12 21 Q10 26 12 31" stroke="#e53935" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M16 21 Q14 26 16 31" stroke="#c62828" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Stripe on tail -->
  <path d="M11 25 Q10 25 12 25" stroke="#ffd54f" stroke-width="2" stroke-linecap="round"/>
</svg>
