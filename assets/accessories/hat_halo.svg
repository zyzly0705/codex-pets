<svg xmlns="http://www.w3.org/2000/svg" width="64" height="32" viewBox="0 0 64 32">
  <defs>
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8dc" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Outer glow -->
  <ellipse cx="32" cy="18" rx="22" ry="8" fill="url(#haloGlow)"/>
  <!-- Halo ring glow -->
  <ellipse cx="32" cy="18" rx="18" ry="6" fill="none" stroke="#ffe566" stroke-width="6" opacity="0.3"/>
  <!-- Main halo ring -->
  <ellipse cx="32" cy="18" rx="18" ry="6" fill="none" stroke="#ffd700" stroke-width="3" filter="url(#glow)"/>
  <!-- Halo top highlight -->
  <path d="M16 16 Q32 11 48 16" fill="none" stroke="#fff8a0" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  <!-- Support wire (thin, barely visible) -->
  <line x1="32" y1="18" x2="32" y2="30" stroke="#ffd700" stroke-width="0.8" opacity="0.4"/>
  <!-- Inner ring shine -->
  <ellipse cx="32" cy="18" rx="10" ry="3" fill="none" stroke="rgba(255,255,200,0.4)" stroke-width="1"/>
</svg>
