<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yoyo Watch TV Scene Preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #17181d;
      color: #f3f5fb;
      font-family: Inter, system-ui, sans-serif;
    }
    .shell {
      width: min(1360px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
      align-items: start;
    }
    .room {
      position: relative;
      aspect-ratio: 1792 / 1280;
      border-radius: 22px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 22px 70px rgba(0,0,0,0.34);
      background: #20242c;
    }
    .room > img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 160ms linear;
    }
    .room > img.active {
      opacity: 1;
    }
    .panel {
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      border: 0;
      border-radius: 10px;
      background: #2f7ee6;
      color: white;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
    }
    button[data-action="autoplay"] {
      background: #5a647d;
      grid-column: 1 / -1;
    }
    .hint {
      color: #98a3b8;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="room">
      <img class="active scene-frame" data-scene-frame="watch_tv_scene_1" src="scene-watch_tv_scene_1.png" alt="scene_1" />
      <img class="scene-frame" data-scene-frame="watch_tv_scene_2" src="scene-watch_tv_scene_2.png" alt="scene_2" />
      <img class="scene-frame" data-scene-frame="watch_tv_scene_3" src="scene-watch_tv_scene_3.png" alt="scene_3" />
    </div>
    <div class="panel">
      <strong>Watch TV Scene Preview</strong>
      <div class="buttons">
        <button data-scene="watch_tv_scene_1">scene_1</button>
        <button data-scene="watch_tv_scene_2">scene_2</button>
        <button data-scene="watch_tv_scene_3">scene_3</button>
        <button data-action="autoplay">Play TV loop</button>
      </div>
      <div id="sceneState">Current: watch_tv_scene_1</div>
      <div class="hint">这里重点看三件事：电视内容是不是像在播动画，Yoyo 的落位是不是在电视语义里，对话泡泡会不会压坏场景。</div>
    </div>
  </div>
  <script>
    const frames = [...document.querySelectorAll('[data-scene-frame]')];
    const stateNode = document.getElementById('sceneState');
    let timers = [];

    function clearLoop() {
      for (const timer of timers) clearTimeout(timer);
      timers = [];
    }

    function setScene(id) {
      frames.forEach((frame) => frame.classList.toggle('active', frame.dataset.sceneFrame === id));
      stateNode.textContent = 'Current: ' + id;
    }

    document.querySelectorAll('button[data-scene]').forEach((button) => {
      button.addEventListener('click', () => {
        clearLoop();
        setScene(button.dataset.scene);
      });
    });

    document.querySelector('button[data-action="autoplay"]').addEventListener('click', () => {
      clearLoop();
      const sequence = [
        { at: 0, id: 'watch_tv_scene_1' },
        { at: 900, id: 'watch_tv_scene_2' },
        { at: 1800, id: 'watch_tv_scene_3' },
        { at: 2700, id: 'watch_tv_scene_1' },
      ];
      sequence.forEach((step) => {
        timers.push(setTimeout(() => setScene(step.id), step.at));
      });
    });

    setScene('watch_tv_scene_1');
  </script>
</body>
</html>
