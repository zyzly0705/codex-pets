<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yoyo Talk Anchor Preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #17181d;
      color: #f3f5fb;
      font-family: Inter, system-ui, sans-serif;
    }
    .shell {
      width: min(1080px, calc(100vw - 32px));
      display: grid;
      grid-template-columns: 1fr 280px;
      gap: 20px;
    }
    .stage {
      border-radius: 18px;
      background: linear-gradient(180deg, #2b2f3b 0%, #20232c 100%);
      border: 1px solid rgba(255,255,255,0.08);
      display: grid;
      place-items: center;
      min-height: 760px;
      overflow: hidden;
    }
    .figure {
      width: min(76vw, 760px);
      aspect-ratio: 1;
      position: relative;
    }
    .figure img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }
    .state-frame {
      opacity: 0;
      transition: opacity 120ms linear;
    }
    .state-frame.active {
      opacity: 1;
    }
    .panel {
      border-radius: 18px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 16px;
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    button {
      border: 0;
      border-radius: 10px;
      background: #2f7ee6;
      color: white;
      padding: 10px 12px;
      font: inherit;
      cursor: pointer;
    }
    button[data-action="demo"] {
      background: #5a647d;
      grid-column: 1 / -1;
    }
    .eye {
      opacity: 0;
      transition: opacity 120ms linear;
    }
    .eye.active {
      opacity: 1;
    }
    .hint {
      color: #98a3b8;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="stage">
      <div class="figure">
        <img class="state-frame active" data-frame="talk_small" src="state-talk_small.png" alt="talk_small" />
        <img class="state-frame" data-frame="talk_open" src="state-talk_open.png" alt="talk_open" />
        <img class="state-frame" data-frame="talk_round" src="state-talk_round.png" alt="talk_round" />
        <img class="state-frame" data-frame="talk_flat" src="state-talk_flat.png" alt="talk_flat" />
        <img class="state-frame" data-frame="happy_talk" src="state-happy_talk.png" alt="happy_talk" />
        <img class="state-frame" data-frame="blink" src="state-blink.png" alt="blink" />
      </div>
    </div>
    <div class="panel">
      <strong>Talk Anchor Preview</strong>
      <div class="buttons">
        <button data-state="talk_small">talk_small</button>
        <button data-state="talk_open">talk_open</button>
        <button data-state="talk_round">talk_round</button>
        <button data-state="talk_flat">talk_flat</button>
        <button data-state="happy_talk">happy_talk</button>
        <button data-state="blink">blink</button>
        <button data-action="demo">Play demo</button>
      </div>
      <div id="state">Current: talk_small</div>
      <div class="hint">This sample uses the full accepted Yoyo art as the base image and swaps only the mouth at a fixed anchor. It is a route check, not the final rig runtime.</div>
    </div>
  </div>
  <script>
    const frames = [...document.querySelectorAll('.state-frame')];
    const stateNode = document.getElementById('state');
    let timers = [];

    function clearDemo() {
      for (const timer of timers) clearTimeout(timer);
      timers = [];
    }

    function setState(state) {
      frames.forEach((frame) => frame.classList.toggle('active', frame.dataset.frame === state));
      stateNode.textContent = 'Current: ' + state;
    }

    document.querySelectorAll('button[data-state]').forEach((button) => {
      button.addEventListener('click', () => {
        clearDemo();
        setState(button.dataset.state);
      });
    });

    document.querySelector('button[data-action="demo"]').addEventListener('click', () => {
      clearDemo();
      const sequence = [
        { at: 0, state: 'talk_small' },
        { at: 260, state: 'talk_open' },
        { at: 520, state: 'talk_round' },
        { at: 760, state: 'talk_flat' },
        { at: 1020, state: 'talk_open' },
        { at: 1300, state: 'blink' },
        { at: 1480, state: 'happy_talk' },
        { at: 1780, state: 'talk_small' },
      ];
      sequence.forEach((step) => {
        timers.push(setTimeout(() => setState(step.state), step.at));
      });
      timers.push(setTimeout(() => setState('talk_small'), 2100));
    });

    setState('talk_small');
  </script>
</body>
</html>
